<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-scheme="basil">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TJN-PYTHON SYSTEM</title>

    <!-- Material 图标字体（Two Tone） -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- mdui Material 3 组件库 -->
    <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
    <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>

    <!-- 项目自定义样式（沿用原版 UI 设计，仅替换交互组件为 mdui） -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- 背景容器 -->
    <div class="background-container" id="backgroundContainer">
        <img class="background-image" id="backgroundImage"
             src="https://images.unsplash.com/photo-1518709268805-4e9042af2176?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80"
             alt="Background">
        <div class="blur-overlay" id="blurOverlay"></div>
    </div>

    <!-- ======== 密钥验证页 ======== -->
    <div class="container page active" id="keyPage">
        <div class="header">
            <div class="header-controls">
                <mdui-button-icon icon="settings--outlined" class="icon-btn" id="keySettingsBtn"></mdui-button-icon>
            </div>
            <div class="header-content">
                <h1 data-i18n="key_page_title"></h1>
                <p data-i18n="key_page_subtitle"></p>
            </div>
        </div>
        <div class="content">
            <div class="attempts-counter" id="attemptsCounter">
                <mdui-chip variant="assist" icon="security--outlined"></mdui-chip>
            </div>
            <mdui-text-field id="keyInput" type="password" variant="outlined"
                             data-i18n-label="key_label" data-i18n-placeholder="key_placeholder"></mdui-text-field>
            <mdui-button id="keySubmitBtn" class="submit-btn" variant="filled">
                <span data-i18n="btn_verify"></span>
            </mdui-button>
            <div class="status-container" id="keyStatusContainer"></div>
            <div id="keyResult" class="result"></div>
        </div>
    </div>

    <!-- ======== 主系统页 ======== -->
    <div class="container page" id="mainPage">
        <div class="header">
            <div class="header-controls">
                <mdui-button-icon icon="settings--outlined" class="icon-btn" id="mainSettingsBtn"></mdui-button-icon>
            </div>
            <div class="header-content">
                <h1 data-i18n="main_page_title"></h1>
                <p data-i18n="main_page_subtitle"></p>
            </div>
        </div>
        <div class="content">
            <mdui-text-field id="userInput" variant="outlined"
                             data-i18n-label="cmd_label" data-i18n-placeholder="cmd_placeholder"></mdui-text-field>
            <mdui-button id="submitBtn" class="submit-btn" variant="filled">
                <span data-i18n="btn_execute"></span>
            </mdui-button>
            <div class="status-container" id="statusContainer"></div>
            <div id="result" class="result"></div>

            <!-- 命令历史记录 -->
            <div class="history-container" id="historyContainer">
                <div class="history-title">
                    <span data-i18n="history_title"></span>
                    <mdui-button-icon icon="clear_all--outlined" class="history-action-btn" id="clearHistoryBtn"></mdui-button-icon>
                </div>
                <mdui-list id="historyList"></mdui-list>
            </div>

            <!-- 收藏夹 -->
            <div class="favorites-container" id="favoritesContainer">
                <div class="favorites-title">
                    <span data-i18n="favorites_title"></span>
                    <mdui-button-icon icon="star_outline--outlined" class="history-action-btn" id="addCurrentToFavoritesBtn"></mdui-button-icon>
                </div>
                <mdui-list id="favoritesList"></mdui-list>
            </div>

            <div class="hint show" id="formatHint"></div>
        </div>
    </div>

    <!-- ======== 无权限页 ======== -->
    <div class="container page" id="lockedPage">
        <div class="header locked-header">
            <div class="header-controls">
                <mdui-button-icon icon="settings--outlined" class="icon-btn" id="lockedSettingsBtn"></mdui-button-icon>
            </div>
            <div class="header-content">
                <h1 data-i18n="locked_page_title"></h1>
                <p data-i18n="locked_page_subtitle"></p>
            </div>
        </div>
        <div class="content">
            <mdui-text-field id="lockedInput" variant="outlined" disabled
                             data-i18n-label="locked_label" data-i18n-placeholder="locked_placeholder"></mdui-text-field>
            <mdui-button id="lockedSubmitBtn" class="submit-btn locked-btn" variant="filled">
                <span data-i18n="btn_no_permission"></span>
            </mdui-button>
            <div class="status-container">
                <div class="status-indicator show error">
                    <div class="status-icon error"><mdui-icon name="block--outlined"></mdui-icon></div>
                    <div class="status-content error">
                        <div class="status-title" data-i18n="locked_badge_title"></div>
                        <div data-i18n="locked_badge_desc"></div>
                    </div>
                </div>
            </div>
            <div id="lockedResult" class="result"></div>
            <div class="hint show locked-hint"></div>
        </div>
    </div>

    <!-- ======== 设置面板（全屏滑动） ======== -->
    <div class="settings-container" id="settingsDialog">
        <div class="settings-header">
            <div class="header-content">
                <h2 class="settings-title" data-i18n="settings_title"></h2>
                <p class="settings-subtitle" data-i18n="settings_subtitle"></p>
            </div>
            <mdui-button-icon icon="close--outlined" class="close-btn" id="closeSettingsBtn"></mdui-button-icon>
        </div>

        <div class="settings-content">

            <!-- 语言 -->
            <section class="settings-section">
                <h3 data-i18n="section_language"></h3>
                <div class="language-options" id="languageOptions">
                    <mdui-card clickable class="language-option" data-lang="auto">
                        <div class="language-flag"><mdui-icon name="brightness_auto--outlined"></mdui-icon></div>
                        <span class="language-name" data-i18n="lang_auto"></span>
                        <mdui-icon name="check--outlined" class="language-check"></mdui-icon>
                    </mdui-card>
                    <mdui-card clickable class="language-option" data-lang="zh-CN">
                        <div class="language-flag">简</div>
                        <span class="language-name">简体中文</span>
                        <mdui-icon name="check--outlined" class="language-check"></mdui-icon>
                    </mdui-card>
                    <mdui-card clickable class="language-option" data-lang="zh-TW">
                        <div class="language-flag">繁</div>
                        <span class="language-name">繁體中文（臺灣）</span>
                        <mdui-icon name="check--outlined" class="language-check"></mdui-icon>
                    </mdui-card>
                    <mdui-card clickable class="language-option" data-lang="en">
                        <div class="language-flag">EN</div>
                        <span class="language-name">English</span>
                        <mdui-icon name="check--outlined" class="language-check"></mdui-icon>
                    </mdui-card>
                    <mdui-card clickable class="language-option" data-lang="ja">
                        <div class="language-flag">日</div>
                        <span class="language-name">日本語</span>
                        <mdui-icon name="check--outlined" class="language-check"></mdui-icon>
                    </mdui-card>
                </div>
            </section>

            <!-- 主题 -->
            <section class="settings-section">
                <h3 data-i18n="section_theme"></h3>
                <div class="theme-options" id="themeOptions">
                    <mdui-card clickable class="theme-option" data-theme-value="light">
                        <div class="theme-icon"><mdui-icon name="light_mode--outlined"></mdui-icon></div>
                        <span class="theme-name" data-i18n="theme_light"></span>
                    </mdui-card>
                    <mdui-card clickable class="theme-option" data-theme-value="dark">
                        <div class="theme-icon"><mdui-icon name="dark_mode--outlined"></mdui-icon></div>
                        <span class="theme-name" data-i18n="theme_dark"></span>
                    </mdui-card>
                    <mdui-card clickable class="theme-option" data-theme-value="auto">
                        <div class="theme-icon"><mdui-icon name="brightness_auto--outlined"></mdui-icon></div>
                        <span class="theme-name" data-i18n="theme_system"></span>
                    </mdui-card>
                </div>
            </section>

            <!-- 主题颜色 -->
            <section class="settings-section">
                <h3 data-i18n="section_theme_color"></h3>
                <div class="monet-options" id="monetOptions">
                    <mdui-card clickable class="monet-option active" data-scheme="basil">
                        <div class="monet-preview"><div class="monet-color-gradient"><div class="monet-color-primary"></div><div class="monet-color-secondary"></div><div class="monet-color-tertiary"></div></div></div>
                        <span class="monet-name" data-i18n="scheme_basil"></span>
                        <mdui-icon name="check--outlined" class="monet-check"></mdui-icon>
                    </mdui-card>
                    <mdui-card clickable class="monet-option" data-scheme="blue">
                        <div class="monet-preview"><div class="monet-color-gradient"><div class="monet-color-primary"></div><div class="monet-color-secondary"></div><div class="monet-color-tertiary"></div></div></div>
                        <span class="monet-name" data-i18n="scheme_blue"></span>
                        <mdui-icon name="check--outlined" class="monet-check"></mdui-icon>
                    </mdui-card>
                    <mdui-card clickable class="monet-option" data-scheme="purple">
                        <div class="monet-preview"><div class="monet-color-gradient"><div class="monet-color-primary"></div><div class="monet-color-secondary"></div><div class="monet-color-tertiary"></div></div></div>
                        <span class="monet-name" data-i18n="scheme_purple"></span>
                        <mdui-icon name="check--outlined" class="monet-check"></mdui-icon>
                    </mdui-card>
                    <mdui-card clickable class="monet-option" data-scheme="orange">
                        <div class="monet-preview"><div class="monet-color-gradient"><div class="monet-color-primary"></div><div class="monet-color-secondary"></div><div class="monet-color-tertiary"></div></div></div>
                        <span class="monet-name" data-i18n="scheme_orange"></span>
                        <mdui-icon name="check--outlined" class="monet-check"></mdui-icon>
                    </mdui-card>
                    <mdui-card clickable class="monet-option" data-scheme="pink">
                        <div class="monet-preview"><div class="monet-color-gradient"><div class="monet-color-primary"></div><div class="monet-color-secondary"></div><div class="monet-color-tertiary"></div></div></div>
                        <span class="monet-name" data-i18n="scheme_pink"></span>
                        <mdui-icon name="check--outlined" class="monet-check"></mdui-icon>
                    </mdui-card>
                </div>
            </section>

            <!-- 背景 -->
            <section class="settings-section">
                <h3 data-i18n="section_background"></h3>
                <div class="background-options" id="backgroundOptions">
                    <mdui-card clickable class="background-option active" data-bg="default">
                        <div class="background-preview"><mdui-icon name="image--outlined"></mdui-icon></div>
                        <span class="background-name" data-i18n="bg_default"></span>
                        <mdui-icon name="check--outlined" class="background-check"></mdui-icon>
                    </mdui-card>
                    <mdui-card clickable class="background-option" data-bg="custom">
                        <div class="background-preview"><mdui-icon name="wallpaper--outlined"></mdui-icon></div>
                        <span class="background-name" data-i18n="bg_custom"></span>
                        <mdui-icon name="check--outlined" class="background-check"></mdui-icon>
                    </mdui-card>
                </div>

                <div class="background-custom-upload" id="customBackgroundUpload" style="display:none">
                    <div class="md3-file-upload">
                        <mdui-button variant="tonal" id="bgUploadBtn" class="bg-upload-btn">
                            <mdui-icon slot="icon" name="upload--outlined"></mdui-icon>
                            <span data-i18n="bg_upload_hint"></span>
                        </mdui-button>
                        <input type="file" id="backgroundFileInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
                    </div>
                    <div class="upload-status" id="uploadStatus"></div>
                    <div class="background-custom-preview" id="customBackgroundInfo" style="display:none">
                        <img id="customBackgroundImage" alt="">
                        <div class="background-custom-info">
                            <span class="background-custom-name"></span>
                        </div>
                        <div class="background-custom-actions">
                            <mdui-button variant="text" color="error" class="background-action-btn delete" id="deleteCustomBackgroundBtn">
                                <span data-i18n="bg_delete"></span>
                            </mdui-button>
                        </div>
                    </div>
                </div>

                <!-- 背景模糊预览 -->
                <div class="blur-control-section">
                    <div class="blur-visual" id="blurVisual"><div class="blur-effect"></div></div>
                    <div class="blur-label" data-i18n="bg_blur_preview"></div>
                </div>
            </section>

            <div class="version-info">
                <mdui-button variant="tonal" class="version-badge" id="versionBadge"><span data-i18n="version_tag"></span></mdui-button>
            </div>
        </div>
    </div>

    <!-- ======== 调试面板（全屏滑动） ======== -->
    <div class="debug-container" id="debugDialog">
        <div class="debug-header">
            <div class="header-content">
                <h2 class="debug-title" data-i18n="debug_title"></h2>
                <p class="debug-subtitle" data-i18n="debug_subtitle"></p>
            </div>
            <mdui-button-icon icon="close--outlined" class="close-btn" id="closeDebugBtn"></mdui-button-icon>
        </div>

        <div class="debug-content">

            <div class="debug-status">
                <div class="debug-status-icon"><mdui-icon name="bug_report--outlined"></mdui-icon></div>
                <div class="debug-status-content">
                    <div class="debug-status-title" data-i18n="debug_active"></div>
                    <div class="debug-status-line"></div>
                </div>
            </div>

            <div class="debug-section">
                <h3 class="debug-category-title"><mdui-icon name="palette--outlined"></mdui-icon><span data-i18n="sec_visual"></span></h3>
                <div class="debug-category-subtitle" data-i18n="sec_visual_sub"></div>
            </div>
            <div class="debug-controls">
                <div class="debug-control">
                    <div class="debug-control-title"><span data-i18n="ctrl_bg_blur"></span><span class="slider-value" id="blurValue">5px</span></div>
                    <mdui-slider id="blurSlider" min="0" max="20" step="1" value="5"></mdui-slider>
                    <div class="blur-visual debug-blur-preview" id="debugBlurVisual"><div class="blur-effect" id="debugBlurEffect"></div></div>
                    <div class="blur-label" data-i18n="bg_blur_preview"></div>
                    <div class="debug-actions">
                        <mdui-button variant="text" id="resetBlurBtn"><span data-i18n="btn_reset"></span></mdui-button>
                        <mdui-button variant="tonal" id="applyBlurBtn"><span data-i18n="btn_apply"></span></mdui-button>
                    </div>
                </div>
                <div class="debug-control">
                    <div class="debug-control-title"><span data-i18n="ctrl_modal_blur"></span><span class="slider-value" id="modalBlurValue">12px</span></div>
                    <mdui-slider id="modalBlurSlider" min="0" max="30" step="1" value="12"></mdui-slider>
                    <div class="debug-actions">
                        <mdui-button variant="text" id="resetModalBlurBtn"><span data-i18n="btn_reset"></span></mdui-button>
                        <mdui-button variant="tonal" id="applyModalBlurBtn"><span data-i18n="btn_apply"></span></mdui-button>
                    </div>
                </div>
            </div>

            <div class="debug-section">
                <h3 class="debug-category-title"><mdui-icon name="security--outlined"></mdui-icon><span data-i18n="sec_security"></span></h3>
                <div class="debug-category-subtitle" data-i18n="sec_security_sub"></div>
            </div>
            <div class="debug-controls">
                <div class="debug-control">
                    <div class="debug-control-title"><span data-i18n="ctrl_attempts"></span><span class="slider-value" id="attemptsValue">3</span></div>
                    <mdui-slider id="attemptsSlider" min="1" max="100" step="1" value="3"></mdui-slider>
                    <div class="debug-actions">
                        <mdui-button variant="text" id="resetAttemptsBtn"><span data-i18n="btn_reset"></span></mdui-button>
                        <mdui-button variant="tonal" id="applyAttemptsBtn"><span data-i18n="btn_save"></span></mdui-button>
                    </div>
                </div>
            </div>

            <div class="debug-section">
                <h3 class="debug-category-title"><mdui-icon name="storage--outlined"></mdui-icon><span data-i18n="sec_storage"></span></h3>
                <div class="debug-category-subtitle" data-i18n="sec_storage_sub"></div>
            </div>
            <div class="debug-controls">
                <div class="debug-control">
                    <div class="debug-control-title"><span data-i18n="ctrl_local_storage"></span></div>
                    <div class="switch-container">
                        <span class="switch-label" data-i18n="ctrl_local_storage"></span>
                        <mdui-switch id="localStorageSwitch" checked></mdui-switch>
                    </div>
                    <div class="debug-actions"><mdui-button variant="tonal" id="applyLocalStorageBtn"><span data-i18n="btn_apply"></span></mdui-button></div>
                </div>
            </div>

            <div class="debug-section">
                <h3 class="debug-category-title"><mdui-icon name="settings--outlined"></mdui-icon><span data-i18n="sec_system"></span></h3>
                <div class="debug-category-subtitle" data-i18n="sec_system_sub"></div>
            </div>
            <div class="debug-controls">
                <div class="debug-control">
                    <div class="debug-control-title"><span data-i18n="ctrl_system_ops"></span></div>
                    <div class="debug-actions">
                        <mdui-button variant="tonal" id="resetAllSettingsBtn"><span data-i18n="btn_reset_all"></span></mdui-button>
                        <mdui-button variant="tonal" color="error" id="clearAllDataBtn"><span data-i18n="btn_clear_all"></span></mdui-button>
                    </div>
                </div>
            </div>

            <div class="version-info">
                <mdui-button variant="tonal" class="version-badge" id="debugVersionBadge"><span data-i18n="debug_version_tag"></span></mdui-button>
            </div>
        </div>
    </div>

    <!-- ======== 确认对话框 ======== -->
    <mdui-dialog id="confirmDialog">
        <div class="dialog-header">
            <div class="dialog-title"><div class="dialog-title-main" id="confirmTitle"></div></div>
        </div>
        <div id="confirmMessage" class="confirm-message"></div>
        <div id="confirmInputContainer" hidden>
            <mdui-text-field id="confirmKeyInput" type="password" variant="outlined" data-i18n-label="unlock_key_label"></mdui-text-field>
        </div>
        <div slot="action" class="debug-actions confirm-actions">
            <mdui-button variant="text" id="confirmCancelBtn"><span data-i18n="btn_cancel"></span></mdui-button>
            <mdui-button variant="tonal" id="confirmConfirmBtn"><span data-i18n="btn_confirm"></span></mdui-button>
        </div>
    </mdui-dialog>

    <!-- 全局提示 -->
    <mdui-snackbar id="snackbar"></mdui-snackbar>

    <script src="./js/i18n.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
